[project]
name = "resume-ai"
version = "1.0.0"
description = "AI-powered resume screening application"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[tool.vercel]
entrypoint = "backend.app:app"
